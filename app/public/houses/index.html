<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Map Interior Generator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
/* Layout: an architect's survey sheet — building index down the left, the model in the middle, the evidence and the
   programme on the right; on phones the three stack. */
:root {
  --paper: #f3f1ea; --sheet: #fbfaf6; --ink: #22262a; --muted: #687078; --rule: #d6d2c6; --accent: #8a3b2a; --accent-ink: #ffffff;
  --scene: #e9e6dc; --chip: #ece8dc;
  --display: "Fraunces", Georgia, serif; --body: "IBM Plex Sans Condensed", "Arial Narrow", Arial, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #15181a; --sheet: #1c2023; --ink: #e7e5df; --muted: #9aa1a6; --rule: #30363a; --accent: #e08a6e; --accent-ink: #1a1210; --scene: #202528; --chip: #262b2e; color-scheme: dark } }
:root[data-theme="dark"] { --paper: #15181a; --sheet: #1c2023; --ink: #e7e5df; --muted: #9aa1a6; --rule: #30363a; --accent: #e08a6e; --accent-ink: #1a1210; --scene: #202528; --chip: #262b2e; color-scheme: dark }
* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.45 var(--body); }
.app { height: 100%; display: grid; grid-template-columns: 250px minmax(0, 1fr) 340px; grid-template-rows: auto minmax(0, 1fr);
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)) }
header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; padding: 12px max(16px, env(safe-area-inset-left, 0px)) 10px; border-bottom: 1px solid var(--rule) }
h1 { font: 600 21px/1.1 var(--display); margin: 0; letter-spacing: -.01em }
nav { border-right: 1px solid var(--rule); overflow: auto; padding: 10px 10px 20px; background: var(--sheet) }
nav h2, aside h2 { font: 500 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 12px 4px 6px }
nav button { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; width: 100%; text-align: left; border: 0; background: transparent; color: var(--ink); padding: 7px 8px; border-radius: 6px; cursor: pointer; font: inherit }
nav button:hover { background: var(--chip) }
nav button[aria-current="true"] { background: var(--accent); color: var(--accent-ink) }
nav button[aria-current="true"] .s { color: var(--accent-ink); opacity: .85 }
nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
nav .n { font-weight: 600; overflow-wrap: anywhere }
nav .s { grid-column: 1 / -1; font: 11px var(--mono); color: var(--muted) }
nav .f { font: 11px var(--mono) }
main { position: relative; min-width: 0; min-height: 0; background: var(--scene) }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none }
/* One toolbar row across the top of the model: view controls on the left, 3D/Blueprint on the right. It wraps
   instead of overlapping, however many floors a building has. */
.toolbar { position: absolute; left: 12px; right: 12px; top: 12px; z-index: 3; display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; justify-content: space-between; pointer-events: none }
.toolbar > * { pointer-events: auto }
.bar { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0 }
.toolbar .bar2 { position: static !important; margin-left: auto }
#seg-view.many button:not([data-v="out"]) { display: none }
.floor-picker { align-items: stretch }
.floor-picker[hidden] { display: none }
.toolbar .seg.floor-picker select { font: 500 12.5px var(--body); color: var(--ink); background: transparent; border: 0; border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); padding: 0 6px; min-width: 104px; cursor: pointer }
.floor-picker button { min-width: 32px; font-size: 14px; line-height: 1 }
.toolbar .seg.floor-picker.active select { background: var(--ink); color: var(--sheet) }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--sheet) }
.seg button { font: 500 12.5px var(--body); color: var(--ink); background: transparent; border: 0; padding: 7px 11px; min-height: 32px; cursor: pointer }
.seg button + button { border-left: 1px solid var(--rule) }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet) }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px }
.hint { position: absolute; right: 12px; bottom: 10px; font: 11px var(--mono); color: var(--muted) }
#loading { position: absolute; left: 12px; bottom: 10px; font: 11px var(--mono); color: var(--muted) }
aside { border-left: 1px solid var(--rule); overflow: auto; padding: 4px 14px 24px; background: var(--sheet); min-width: 0 }
.title { font: 600 18px/1.2 var(--display); margin: 10px 0 2px; text-wrap: balance }
.sub { color: var(--muted); font-size: 12.5px; margin: 0 }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px }
.chip { font: 500 11px var(--mono); padding: 2px 8px; border-radius: 99px; background: var(--chip) }
.chip.k { background: var(--accent); color: var(--accent-ink) }
ol.ev { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 12.5px }
ol.ev b { font-weight: 600 }
ol.ev span { color: var(--muted); font-family: var(--mono); font-size: 11px; display: block }
table { width: 100%; border-collapse: collapse; font-size: 12.5px }
td, th { padding: 3px 4px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top }
th { font: 500 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
td.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums }
details.ux > summary { cursor: pointer; list-style: none; font: 500 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 14px 4px 6px 0; display: flex; align-items: center; gap: 6px }
details.ux > summary::-webkit-details-marker { display: none }
details.ux > summary::before { content: "▸"; font-size: 10px; transition: transform .15s }
details.ux[open] > summary::before { transform: rotate(90deg) }
details.ux > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.checks-sum { font-size: 13px; margin: 6px 0 0; font-weight: 600 }
.checks-sum.fail { color: var(--accent) }
ul.log { margin: 0; padding-left: 16px; font-size: 12px; color: var(--muted); display: grid; gap: 2px }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px }
.stat { background: var(--chip); border-radius: 6px; padding: 6px 8px }
.stat b { display: block; font: 600 16px var(--mono) }
.stat span { font-size: 11px; color: var(--muted) }
@media (max-width: 980px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto 62vh auto; height: auto }
  html, body { height: auto }
  nav { border-right: 0; border-bottom: 1px solid var(--rule); max-height: 220px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  main { min-height: 62vh }
  .app > .toolbar { position: static; display: flex; flex-wrap: wrap; gap: 8px; padding: 8px max(16px, env(safe-area-inset-left, 0px)); background: var(--sheet); border-bottom: 1px solid var(--rule) }
  aside { border-left: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
}
</style>
  <script type="module" crossorigin src="./assets/index-merrell3.js"></script>
  <script type="module" src="./assets/plan2d.js"></script>
  <script type="module" src="./assets/worldmap.js"></script>
  <script type="module" src="./assets/ui.js"></script>


<div class="app">
  <header>
    <h1>Map Interior Generator</h1>
  </header>
  <nav id="list" aria-label="Buildings"></nav>
  <main>
    <canvas id="cv" aria-label="3D model of the selected building"></canvas>
    <div class="toolbar">
    <div class="bar">
      <div class="seg" id="seg-view" role="group" aria-label="Cutaway"></div>
      <div class="seg" id="seg-furn" role="group" aria-label="Furniture"><button id="f-on" data-v="1">Furniture</button><button id="f-off" data-v="0">Shell only</button></div>
    </div>
    </div>
    <div id="loading"></div>
    <div class="hint">drag to orbit · right-drag to pan · scroll to zoom</div>
  </main>
  <aside id="info"></aside>
</div>

</body></html>
