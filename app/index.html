<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geo-voxels Map Builder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='7' width='6' height='8' fill='%23c9a46a'/%3E%3Crect x='8' y='3' width='7' height='12' fill='%238aa2c2'/%3E%3C/svg%3E">
</head>
<body>
<aside id="panel">
  <header><h1>Map Builder</h1><p>geo-voxels · procedural towns and real places</p></header>

  <section>
    <h2>Generator</h2>
    <div id="generators" class="seg"></div>
    <p id="gen-text" class="note"></p>
    <label id="theme-row">Theme <select id="theme"></select></label>
    <p id="theme-text" class="note"></p>

    <div id="place-box" hidden>
      <label>Example <select id="example"></select></label>
      <label class="file">…or your own export <input id="place-file" type="file" accept=".json,application/json"><span id="place-file-name"></span></label>
      <p class="note">Make one for any coordinates with <code>geo-voxels blender --lat … --lon …</code> (Blender + BlenderGIS).</p>
      <label>Name <input id="place-name" placeholder="from the file"></label>
      <label>Objective building <input id="place-objective" placeholder="optional, e.g. Old State Capitol"></label>
      <label>Max playable storeys <select id="place-storeys"><option>3</option><option>2</option><option>1</option></select></label>
      <label class="check"><input id="place-cover" type="checkbox"> Game cover fill <small>trees, walls on open land</small></label>
    </div>

    <div id="district-box" hidden>
      <div class="grid2">
        <label>Width <select id="p-width"><option>96</option><option>112</option><option>128</option></select></label>
        <label>Depth <select id="p-depth"><option>72</option><option>84</option><option>96</option></select></label>
        <label>Shape <select id="p-shape"><option value="auto">theme</option><option>rectangle</option><option>L</option><option>T</option></select></label>
        <label>Storeys <select id="p-storeys"><option value="auto">theme</option><option>1-1</option><option>1-2</option><option>1-3</option><option>2-3</option><option>3-3</option></select></label>
        <label>Buildings <input id="p-count" type="number" min="3" max="24" placeholder="theme"></label>
        <label>Traffic <select id="p-traffic"><option value="auto">theme</option><option>none</option><option>light</option><option>normal</option><option>heavy</option></select></label>
        <label>Walls <select id="p-wall"><option value="auto">mixed</option><option>brick</option><option>stucco</option><option value="concrete_wall">concrete</option><option>siding</option></select></label>
        <label>Glazing <select id="p-glazing"><option value="auto">mixed</option><option>full</option><option>band</option><option>punched</option></select></label>
        <label>Terrain <select id="p-terrain"><option value="auto">theme</option><option>flat</option><option>terraced</option></select></label>
      </div>
      <label class="check"><input id="p-sky" type="checkbox" checked> Skybridges</label>
      <label class="check"><input id="p-furnish" type="checkbox" checked> Furnished interiors</label>
    </div>

    <div class="row">
      <label class="seed">Seed <input id="seed" type="number" min="0"></label>
      <button id="dice" title="Random seed and generate">🎲</button>
    </div>
    <label class="check"><input id="tactics" type="checkbox"> Tactics plugin <small>spawns, cover, gate metrics</small></label>
    <button id="go" class="primary">Generate</button>
  </section>

  <section id="layers" hidden>
    <h2>View</h2>
    <label class="range">Floor cutaway <input id="cut" type="range" min="1" step="1"><span id="cut-label">all</span></label>
    <div class="checks">
      <label class="check"><input id="lay-props" type="checkbox"> Props</label>
      <label class="check"><input id="lay-paint" type="checkbox"> Road paint</label>
      <label class="check"><input id="lay-rooms" type="checkbox"> Rooms</label>
      <label class="check"><input id="lay-cover" type="checkbox"> Cover</label>
      <label class="check"><input id="lay-spawns" type="checkbox"> Spawns</label>
    </div>
  </section>

  <section id="export" hidden>
    <h2>Export</h2>
    <div class="exports">
      <button id="ex-vox" title="MagicaVoxel; Blender, Godot, Unity, Unreal importers">.vox</button>
      <button id="ex-glb" title="The mesh as shown (glTF binary)">.glb</button>
      <button id="ex-map" title="Buildings, rooms, doors, stairs, props, road paint, meta, plugins">map.json</button>
      <button id="ex-grid" title="Run-length voxel grid with palette">grid.json</button>
      <button id="ex-png" title="Screenshot">.png</button>
    </div>
  </section>
  <div id="stats"></div>
</aside>
<main id="view">
  <div id="inspect" hidden></div>
  <div id="busy" hidden><div class="bar"></div><span id="busy-text"></span></div>
  <div id="toast" hidden></div>
  <p id="hint">Drag to orbit · right-drag to pan · scroll to zoom · click a voxel to inspect</p>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
